name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install

      - name: Release notes
        id: notes
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          {
            echo "body<<EDCH_NOTES_END"
            python tools/release_notes.py "$version"
            echo "EDCH_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      # Builds the installers. A v* tag, or a push to main whose commit message contains
      # "[release]", also publishes a GitHub release (tag v<version from tauri.conf.json>),
      # which installed copies of EDCH pick up as an update.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]') && 'v__VERSION__') || '' }}
          releaseName: "EDCH v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false

      # Portable version: the same exe, named so EDCH knows it isn't installed (its updates
      # open the release page instead of running an installer).
      - name: Portable exe
        id: portable
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          file="EDCH_${version}_x64-portable.exe"
          cp src-tauri/target/release/edch.exe "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Attach the portable exe to the release
        if: steps.tauri.outputs.releaseId != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.portable.outputs.tag }}" "${{ steps.portable.outputs.file }}" --clobber -R "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: edch-windows
          path: |
            ${{ steps.portable.outputs.file }}
            src-tauri/target/release/edch.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
