name: Build

on:
  push:
    # prerelease/*: test builds, published as GitHub pre-releases (see "Release tag").
    branches: [main, "prerelease/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install

      - name: Release notes
        id: notes
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          {
            echo "body<<EDCH_NOTES_END"
            python tools/release_notes.py "$version"
            echo "EDCH_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      # Which release this run publishes, if any:
      #  - a v* tag: that tag;
      #  - main with "[release]" in the commit message: v<version from tauri.conf.json>;
      #  - a prerelease/* branch: v<version>-pre.<run number>, as a GitHub pre-release. EDCH's
      #    update check asks for the latest release, which never is a pre-release, so installed
      #    copies are not offered these test builds.
      - name: Release tag
        id: rel
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag=""; pre=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$MESSAGE" == *"[release]"* ]]; then tag="v$version"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/prerelease/* ]]; then tag="v$version-pre.$GITHUB_RUN_NUMBER"; pre=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pre=$pre" >> "$GITHUB_OUTPUT"
          echo "Release: ${tag:-none} (pre-release: $pre)"

      # Builds the installers, and publishes them when "Release tag" names a release.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.rel.outputs.tag }}
          releaseName: ${{ steps.rel.outputs.pre == 'true' && format('EDCH {0} (test build)', steps.rel.outputs.tag) || 'EDCH v__VERSION__' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.rel.outputs.pre == 'true' }}

      # Portable version: the same exe, named so EDCH knows it isn't installed (its updates
      # open the release page instead of running an installer).
      - name: Portable exe
        id: portable
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          file="EDCH_${version}_x64-portable.exe"
          cp src-tauri/target/release/edch.exe "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Attach the portable exe to the release
        if: steps.tauri.outputs.releaseId != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.rel.outputs.tag }}" "${{ steps.portable.outputs.file }}" --clobber -R "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: edch-windows
          path: |
            ${{ steps.portable.outputs.file }}
            src-tauri/target/release/edch.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Linux: AppImage, .deb and .rpm (Tauri), then an Arch PKGBUILD and a Flatpak (experimental),
  # attached to the same release. After the Windows job, so the release already exists.
  linux:
    needs: windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm install
      # Rust style and lints (docs/ARCHITECTURE.md): any clippy warning fails the build.
      # The UI is built first: compiling the backend embeds dist/.
      - name: Build the UI
        run: npm run build
      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Release notes
        id: notes
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EDCH_NOTES_END"
            python3 tools/release_notes.py "$version"
            echo "EDCH_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      # Which release this run publishes, if any:
      #  - a v* tag: that tag;
      #  - main with "[release]" in the commit message: v<version from tauri.conf.json>;
      #  - a prerelease/* branch: v<version>-pre.<run number>, as a GitHub pre-release. EDCH's
      #    update check asks for the latest release, which never is a pre-release, so installed
      #    copies are not offered these test builds.
      - name: Release tag
        id: rel
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag=""; pre=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$MESSAGE" == *"[release]"* ]]; then tag="v$version"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/prerelease/* ]]; then tag="v$version-pre.$GITHUB_RUN_NUMBER"; pre=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pre=$pre" >> "$GITHUB_OUTPUT"
          echo "Release: ${tag:-none} (pre-release: $pre)"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.rel.outputs.tag }}
          releaseName: ${{ steps.rel.outputs.pre == 'true' && format('EDCH {0} (test build)', steps.rel.outputs.tag) || 'EDCH v__VERSION__' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.rel.outputs.pre == 'true' }}

      - name: Arch Linux PKGBUILD
        id: arch
        shell: bash
        run: |
          version="${{ steps.notes.outputs.version }}"
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          cp "$deb" edch.deb
          sum=$(sha256sum "$deb" | cut -d' ' -f1)
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$sum/" packaging/aur/PKGBUILD.in > PKGBUILD
          ldd src-tauri/target/release/edch | grep -E "xdo|webkit|soup" || true

      - name: Attach the PKGBUILD to the release
        if: steps.tauri.outputs.releaseId != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.rel.outputs.tag }}" PKGBUILD --clobber -R "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: edch-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            PKGBUILD
            edch.deb
          if-no-files-found: error

  # Flatpak bundle from the .deb (experimental: a failure here doesn't block the release).
  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edch-linux
          path: linux
      - name: Place the .deb next to the manifest
        run: cp linux/edch.deb packaging/flatpak/edch.deb
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: EDCH.flatpak
          manifest-path: packaging/flatpak/io.github.bknadir.EDCH.yml
          cache-key: flatpak-edch
      - name: Attach the Flatpak to the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! command -v gh >/dev/null; then dnf install -y gh || (curl -sL https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_amd64.tar.gz | tar xz && cp gh_*/bin/gh /usr/local/bin/); fi
          cp EDCH.flatpak "EDCH_${version}_x86_64.flatpak"
          gh release upload "v${version}" "EDCH_${version}_x86_64.flatpak" --clobber -R "${{ github.repository }}"
