name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install

      - name: Release notes
        id: notes
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          {
            echo "body<<EDCH_NOTES_END"
            python tools/release_notes.py "$version"
            echo "EDCH_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      # Builds the installers. A v* tag, or a push to main whose commit message contains
      # "[release]", also publishes a GitHub release (tag v<version from tauri.conf.json>),
      # which installed copies of EDCH pick up as an update.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]') && 'v__VERSION__') || '' }}
          releaseName: "EDCH v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false

      # Portable version: the same exe, named so EDCH knows it isn't installed (its updates
      # open the release page instead of running an installer).
      - name: Portable exe
        id: portable
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          file="EDCH_${version}_x64-portable.exe"
          cp src-tauri/target/release/edch.exe "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Attach the portable exe to the release
        if: steps.tauri.outputs.releaseId != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.portable.outputs.tag }}" "${{ steps.portable.outputs.file }}" --clobber -R "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: edch-windows
          path: |
            ${{ steps.portable.outputs.file }}
            src-tauri/target/release/edch.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Linux: AppImage, .deb and .rpm (Tauri), then an Arch PKGBUILD and a Flatpak (experimental),
  # attached to the same release. After the Windows job, so the release already exists.
  linux:
    needs: windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm install

      - name: Release notes
        id: notes
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EDCH_NOTES_END"
            python3 tools/release_notes.py "$version"
            echo "EDCH_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]') && 'v__VERSION__') || '' }}
          releaseName: "EDCH v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false

      - name: Arch Linux PKGBUILD
        id: arch
        shell: bash
        run: |
          version="${{ steps.notes.outputs.version }}"
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          cp "$deb" edch.deb
          sum=$(sha256sum "$deb" | cut -d' ' -f1)
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$sum/" packaging/aur/PKGBUILD.in > PKGBUILD
          ldd src-tauri/target/release/edch | grep -E "xdo|webkit|soup" || true

      - name: Attach the PKGBUILD to the release
        if: steps.tauri.outputs.releaseId != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.notes.outputs.version }}" PKGBUILD --clobber -R "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: edch-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            PKGBUILD
            edch.deb
          if-no-files-found: error

  # Flatpak bundle from the .deb (experimental: a failure here doesn't block the release).
  flatpak:
    needs: linux
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: edch-linux
          path: linux
      - name: Place the .deb next to the manifest
        run: cp linux/edch.deb packaging/flatpak/edch.deb
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: EDCH.flatpak
          manifest-path: packaging/flatpak/io.github.bknadir.EDCH.yml
          cache-key: flatpak-edch
      - name: Attach the Flatpak to the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! command -v gh >/dev/null; then dnf install -y gh || (curl -sL https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_amd64.tar.gz | tar xz && cp gh_*/bin/gh /usr/local/bin/); fi
          cp EDCH.flatpak "EDCH_${version}_x86_64.flatpak"
          gh release upload "v${version}" "EDCH_${version}_x86_64.flatpak" --clobber -R "${{ github.repository }}"

