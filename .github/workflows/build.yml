name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install

      # Builds the installers. A v* tag, or a push to main whose commit message contains
      # "[release]", also publishes a GitHub release (tag v<version from tauri.conf.json>),
      # which installed copies of EDCH pick up as an update.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]') && 'v__VERSION__') || '' }}
          releaseName: "EDCH v__VERSION__"
          releaseBody: "Install the .exe (NSIS) or the .msi. Installed copies of EDCH offer this update by themselves. · Installe le .exe (NSIS) ou le .msi. EDCH déjà installé propose cette mise à jour tout seul."
          releaseDraft: false

      - uses: actions/upload-artifact@v4
        with:
          name: edch-windows
          path: |
            src-tauri/target/release/edch.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
