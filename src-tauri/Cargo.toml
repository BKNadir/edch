[package]
name = "edch"
version = "0.5.2"
description = "Elite Dangerous companion: materials, engineering and where to find them"
authors = ["BKNadir"]
edition = "2021"
license = "MIT"

[lib]
name = "edch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
