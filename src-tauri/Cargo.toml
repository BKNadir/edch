[package]
name = "ed-companion"
version = "0.1.0"
description = "Elite Dangerous companion: materials, engineering and where to find them"
authors = ["BKNadir"]
edition = "2021"
license = "MIT"

[lib]
name = "ed_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
