<!doctype html>
<!--
  EDCH: the return page of the Frontier login (the redirect_uri registered in Frontier's
  Developer Zone). Frontier sends the player here with a one-time code; this page only hands it
  to EDCH on the same PC, through an edch:// link, and shows it for a copy-paste if the link
  doesn't open. It stores nothing, loads nothing from elsewhere and sends nothing anywhere.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"
    />
    <title>EDCH – Frontier login</title>
    <style>
      :root {
        --bg: #0a0c0f;
        --panel: #11151a;
        --line: #222932;
        --text: #e7e9ec;
        --muted: #8a94a2;
        --accent: #ff7a18;
        --bad: #ff6b6b;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
      }
      main {
        box-sizing: border-box;
        width: min(560px, calc(100vw - 32px));
        padding: 24px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        display: grid;
        gap: 14px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        color: var(--accent);
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
      }
      .bad {
        color: var(--bad);
      }
      .copy {
        display: flex;
        gap: 8px;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        font: 13px ui-monospace, monospace;
      }
      button,
      a.button {
        padding: 8px 14px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #111;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>EDCH</h1>
      <p id="title"></p>
      <p id="detail" class="sub"></p>
      <div id="manual" hidden>
        <p class="sub" id="manual-help"></p>
        <div class="copy">
          <input id="link" readonly aria-label="EDCH" />
          <button id="copy" type="button"></button>
        </div>
      </div>
      <p><a class="button" id="open" hidden></a></p>
    </main>
    <script>
      // The texts, in the languages EDCH speaks; English when the browser's isn't one of them.
      const TEXTS = {
        en: {
          opening: "Back to EDCH…",
          openingDetail: "Your browser may ask whether to open EDCH: accept. You can then close this tab.",
          manualHelp: "If EDCH didn't open, copy this and paste it in EDCH (Synchro → Frontier).",
          copy: "Copy",
          copied: "Copied",
          open: "Open EDCH",
          failed: "Frontier didn't log you in.",
          nothing: "This page is used by EDCH when you log in to Frontier. Start the login from EDCH.",
        },
        fr: {
          opening: "Retour vers EDCH…",
          openingDetail: "Ton navigateur peut demander s'il faut ouvrir EDCH : accepte. Tu peux ensuite fermer cet onglet.",
          manualHelp: "Si EDCH ne s'est pas ouvert, copie ceci et colle-le dans EDCH (Synchro → Frontier).",
          copy: "Copier",
          copied: "Copié",
          open: "Ouvrir EDCH",
          failed: "Frontier ne t'a pas connecté.",
          nothing: "Cette page sert à EDCH quand tu te connectes à Frontier. Lance la connexion depuis EDCH.",
        },
        de: {
          opening: "Zurück zu EDCH…",
          openingDetail: "Dein Browser fragt eventuell, ob EDCH geöffnet werden soll: bestätige. Danach kannst du diesen Tab schließen.",
          manualHelp: "Falls EDCH sich nicht geöffnet hat, kopiere dies und füge es in EDCH ein (Synchro → Frontier).",
          copy: "Kopieren",
          copied: "Kopiert",
          open: "EDCH öffnen",
          failed: "Frontier hat dich nicht angemeldet.",
          nothing: "Diese Seite nutzt EDCH bei der Anmeldung bei Frontier. Starte die Anmeldung in EDCH.",
        },
        es: {
          opening: "Volviendo a EDCH…",
          openingDetail: "Tu navegador puede preguntar si abrir EDCH: acepta. Después puedes cerrar esta pestaña.",
          manualHelp: "Si EDCH no se abrió, copia esto y pégalo en EDCH (Sincro → Frontier).",
          copy: "Copiar",
          copied: "Copiado",
          open: "Abrir EDCH",
          failed: "Frontier no te ha conectado.",
          nothing: "EDCH usa esta página cuando te conectas a Frontier. Inicia la conexión desde EDCH.",
        },
        pt: {
          opening: "Voltando ao EDCH…",
          openingDetail: "Seu navegador pode perguntar se deve abrir o EDCH: aceite. Depois você pode fechar esta aba.",
          manualHelp: "Se o EDCH não abriu, copie isto e cole no EDCH (Sincronização → Frontier).",
          copy: "Copiar",
          copied: "Copiado",
          open: "Abrir o EDCH",
          failed: "A Frontier não conectou você.",
          nothing: "O EDCH usa esta página quando você se conecta à Frontier. Inicie a conexão pelo EDCH.",
        },
        ru: {
          opening: "Возврат в EDCH…",
          openingDetail: "Браузер может спросить, открыть ли EDCH: согласитесь. Затем эту вкладку можно закрыть.",
          manualHelp: "Если EDCH не открылся, скопируйте это и вставьте в EDCH (Синхронизация → Frontier).",
          copy: "Копировать",
          copied: "Скопировано",
          open: "Открыть EDCH",
          failed: "Frontier не выполнил вход.",
          nothing: "Эта страница используется EDCH при входе во Frontier. Начните вход из EDCH.",
        },
      };
      const language = (navigator.language || "en").slice(0, 2).toLowerCase();
      const text = TEXTS[language] || TEXTS.en;
      document.documentElement.lang = TEXTS[language] ? language : "en";
      const show = (id, value) => (document.getElementById(id).textContent = value);

      const params = new URLSearchParams(location.search);
      // The code is used once: it leaves the address bar and the browser's history right away.
      history.replaceState(null, "", location.pathname);
      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");
      // Only what a Frontier code and state look like goes into the link.
      const sane = (value) => typeof value === "string" && /^[A-Za-z0-9._~-]{1,512}$/.test(value);

      if (sane(code) && sane(state)) {
        const link = `edch://frontier/?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}`;
        show("title", text.opening);
        show("detail", text.openingDetail);
        show("manual-help", text.manualHelp);
        show("copy", text.copy);
        show("open", text.open);
        document.getElementById("link").value = link;
        const open = document.getElementById("open");
        open.href = link;
        open.hidden = false;
        document.getElementById("manual").hidden = false;
        document.getElementById("copy").onclick = async () => {
          const input = document.getElementById("link");
          input.select();
          try {
            await navigator.clipboard.writeText(input.value);
          } catch {
            document.execCommand("copy");
          }
          show("copy", text.copied);
        };
        location.href = link;
      } else if (error) {
        show("title", text.failed);
        document.getElementById("title").className = "bad";
        // Frontier's own words, as text only.
        show("detail", (params.get("error_description") || error).slice(0, 300));
      } else {
        show("title", text.nothing);
      }
    </script>
  </body>
</html>
